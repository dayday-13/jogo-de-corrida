  <!-- Main Game Script with Babel JSX -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- PROCEDURAL SOUND SYNTHESIZER ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
        this.musicEnabled = true;
        this.musicInterval = null;
        this.musicStep = 0;
      }
      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      setSoundEnabled(e) { this.soundEnabled = e; }
      setMusicEnabled(e) {
        this.musicEnabled = e;
        if (!e) this.stopMusic();
        else this.startMusic();
      }
      playCoin(combo = 0) {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        const freqs = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
        const freq = freqs[Math.min(combo, freqs.length - 1)];
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
      }
      playJump() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      playSlide() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(350, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      playPowerUp() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = this.ctx.currentTime + idx * 0.07;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.2, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.2);
        });
      }
      playSeasonChange() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = this.ctx.currentTime + idx * 0.09;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.18, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
      }
      playCrash() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.38);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.38);
      }
      playHoverboard() {
        if (!this.soundEnabled) return;
        this.initContext();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.28);
      }
      startMusic() {
        if (!this.musicEnabled || this.musicInterval) return;
        this.initContext();
        const stepTime = (60 / 135 / 4) * 1000;
        const bassline = [82.41, 0, 82.41, 82.41, 110.0, 0, 98.0, 0, 82.41, 0, 82.41, 123.47, 110.0, 0, 73.42, 0];
        const leadNotes = [0, 329.63, 0, 392.00, 0, 440.00, 0, 493.88, 0, 440.00, 0, 392.00, 0, 329.63, 0, 0];
        this.musicInterval = window.setInterval(() => {
          if (!this.ctx || !this.musicEnabled || this.ctx.state !== 'running') return;
          const idx = this.musicStep % 16;
          const bFreq = bassline[idx];
          const lFreq = leadNotes[idx];
          const now = this.ctx.currentTime;
          if (bFreq > 0) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(bFreq, now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
          }
          if (lFreq > 0 && Math.floor(this.musicStep / 16) % 2 === 1) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(lFreq, now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
          }
          this.musicStep++;
        }, stepTime);
      }
      stopMusic() {
        if (this.musicInterval) {
          clearInterval(this.musicInterval);
          this.musicInterval = null;
        }
      }
    }
    const soundManager = new SoundManager();

    // --- PROCEDURAL TEXTURES & SEASONS CONFIG ---
    const SEASONS_DATA = {
      SPRING: {
        type: 'SPRING',
        name: 'Flores da Primavera',
        subtitle: 'Cerejeiras em flor e pétalas ao vento',
        icon: '🌸',
        skyColors: ['#1e3a8a', '#fda4af', '#fef08a'],
        fogColor: 0xffe4e6,
        sunColor: 0xffedd5,
        ambientColor: 0xfce7f3,
        sleeperColor: 0x582f0e,
        treeColors: [0xf472b6, 0xfb7185, 0x4ade80, 0xec4899],
        particleType: 'PETALS',
        particleColor: 0xf472b6,
      },
      SUMMER: {
        type: 'SUMMER',
        name: 'Verão Radiante',
        subtitle: 'Calor vibrante, folhas verdes e vaga-lumes',
        icon: '☀️',
        skyColors: ['#0369a1', '#f59e0b', '#ea580c'],
        fogColor: 0xfed7aa,
        sunColor: 0xfef08a,
        ambientColor: 0xfef3c7,
        sleeperColor: 0x451a03,
        treeColors: [0x16a34a, 0x15803d, 0x166534, 0x65a30d],
        particleType: 'FIREFLIES',
        particleColor: 0xfef08a,
      },
      AUTUMN: {
        type: 'AUTUMN',
        name: 'Outono Gelado',
        subtitle: 'Folhas douradas e brisa fria da floresta',
        icon: '🍁',
        skyColors: ['#312e81', '#7c2d12', '#d97706'],
        fogColor: 0xddb892,
        sunColor: 0xfdba74,
        ambientColor: 0xfde68a,
        sleeperColor: 0x3e2723,
        treeColors: [0xd97706, 0xe11d48, 0xb45309, 0xc2410c],
        particleType: 'LEAVES',
        particleColor: 0xea580c,
      },
      WINTER: {
        type: 'WINTER',
        name: 'Inverno de Neve',
        subtitle: 'Pinheiros congelados e nevasca mágica',
        icon: '❄️',
        skyColors: ['#0f172a', '#1e293b', '#67e8f9'],
        fogColor: 0xdbeafe,
        sunColor: 0xe0f2fe,
        ambientColor: 0xeff6ff,
        sleeperColor: 0x334155,
        treeColors: [0x0f766e, 0x115e59, 0x93c5fd, 0xe2e8f0],
        particleType: 'SNOW',
        particleColor: 0xffffff,
      },
    };
    const SEASONS_ORDER = ['SPRING', 'SUMMER', 'AUTUMN', 'WINTER'];

    function createForestSkyTexture(season) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const cfg = SEASONS_DATA[season];
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, cfg.skyColors[0]);
      skyGrad.addColorStop(0.55, cfg.skyColors[1]);
      skyGrad.addColorStop(0.85, cfg.skyColors[2]);
      skyGrad.addColorStop(1.0, season === 'WINTER' ? '#cbd5e1' : '#14532d');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const isWinter = season === 'WINTER';
      const sunGrad = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.65, 10, canvas.width * 0.5, canvas.height * 0.65, isWinter ? 200 : 350);
      sunGrad.addColorStop(0, isWinter ? 'rgba(255,255,255,0.95)' : 'rgba(254,240,138,0.95)');
      sunGrad.addColorStop(0.3, isWinter ? 'rgba(224,242,254,0.7)' : 'rgba(251,146,60,0.6)');
      sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      return new THREE.CanvasTexture(canvas);
    }

    function createForestGroundTexture(season) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      if (season === 'SPRING') {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 40; i++) {
          ctx.fillStyle = Math.random() > 0.4 ? '#ffffff' : '#f472b6';
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (season === 'SUMMER') {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (season === 'AUTUMN') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const leaves = ['#ea580c', '#f59e0b', '#dc2626'];
        for (let i = 0; i < 60; i++) {
          ctx.fillStyle = leaves[Math.floor(Math.random() * leaves.length)];
          ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 4, 3);
        }
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function createHazardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a';
      for (let x = -128; x < 256; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 16, 0);
        ctx.lineTo(x + 16 - 128, 128);
        ctx.lineTo(x - 128, 128);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 1);
      return tex;
    }

    function createCorrugatedMetalTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < 128; y += 16) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, y, 128, 8);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(0, y + 8, 128, 8);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // --- GAME ENGINE IMPLEMENTATION ---
    class SubwayEngine {
      constructor(container, callbacks, skin, hoverboardSkin, durations) {
        this.container = container;
        this.callbacks = callbacks;
        this.currentSkin = skin;
        this.currentHoverboardSkin = hoverboardSkin;
        this.powerUpDurations = Object.assign({ MAGNET: 12, MULTIPLIER: 12, JETPACK: 8, SNEAKERS: 12 }, durations);

        this.isRunning = false;
        this.isPaused = false;
        this.baseSpeed = 28;
        this.currentSpeed = 28;
        this.maxSpeed = 55;
        this.distanceTraveled = 0;
        this.score = 0;
        this.coinsThisRun = 0;
        this.scoreMultiplier = 1;
        this.coinCombo = 0;
        this.lastCoinTime = 0;

        // Lane & Jump
        this.currentLane = 0;
        this.targetLaneX = 0;
        this.playerX = 0;
        this.playerY = 0;
        this.playerVelocityY = 0;
        this.isGrounded = true;
        this.isJumping = false;
        this.isSliding = false;
        this.slideTimer = 0;
        this.currentGroundY = 0;
        this.laneWidth = 3.3;

        // Hoverboard & Powerups
        this.hasHoverboard = false;
        this.hoverboardTime = 0;
        this.activePowerUps = new Map();

        // Seasons
        this.currentSeason = 'SPRING';
        this.currentSeasonIndex = 0;
        this.seasonTimer = 0;
        this.seasonDuration = 22;
        this.skyTextures = {};
        this.groundTextures = {};

        // Chunks
        this.chunkLength = 65;
        this.totalChunks = 7;
        this.trackChunks = [];
        this.obstacles = [];
        this.coins = [];
        this.powerUpItems = [];
        this.particles = [];
        this.weatherParticles = [];

        this.hazardTexture = createHazardTexture();
        SEASONS_ORDER.forEach(s => {
          this.skyTextures[s] = createForestSkyTexture(s);
          this.groundTextures[s] = createForestGroundTexture(s);
        });

        this.initThree();
        this.createPlayerRig();
        this.initWeatherSystem();
        this.initWorld();

        this.handleResize = this.handleResize.bind(this);
        window.addEventListener('resize', this.handleResize);
      }

      initThree() {
        const w = this.container.clientWidth || window.innerWidth;
        const h = this.container.clientHeight || window.innerHeight;
        this.scene = new THREE.Scene();
        const initCfg = SEASONS_DATA[this.currentSeason];
        this.scene.background = new THREE.Color(initCfg.fogColor);
        this.scene.fog = new THREE.FogExp2(initCfg.fogColor, 0.009);

        this.camera = new THREE.PerspectiveCamera(62, w / h, 0.1, 450);
        this.camera.position.set(0, 4.3, 5.8);
        this.camera.lookAt(0, 2.0, -12);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        // Sky Dome
        const skyGeo = new THREE.SphereGeometry(300, 24, 16);
        const skyMat = new THREE.MeshBasicMaterial({ map: this.skyTextures[this.currentSeason], side: THREE.BackSide, depthWrite: false });
        this.skyDomeMesh = new THREE.Mesh(skyGeo, skyMat);
        this.scene.add(this.skyDomeMesh);

        // Lighting
        this.ambientLight = new THREE.AmbientLight(initCfg.ambientColor, 0.85);
        this.scene.add(this.ambientLight);

        this.sunLight = new THREE.DirectionalLight(initCfg.sunColor, 1.7);
        this.sunLight.position.set(20, 38, 15);
        this.sunLight.castShadow = true;
        this.sunLight.shadow.mapSize.width = 1024;
        this.sunLight.shadow.mapSize.height = 1024;
        this.scene.add(this.sunLight);

        this.clock = new THREE.Clock();
      }

      createPlayerRig() {
        this.playerGroup = new THREE.Group();
        this.playerBodyMesh = new THREE.Group();

        const skinMat = new THREE.MeshStandardMaterial({ color: this.currentSkin.skinTone, roughness: 0.55 });
        const hoodieMat = new THREE.MeshStandardMaterial({ color: this.currentSkin.hoodieColor, roughness: 0.45 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: this.currentSkin.pantsColor, roughness: 0.65 });
        const capMat = new THREE.MeshStandardMaterial({ color: this.currentSkin.capColor, roughness: 0.35 });

        // Torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.98, 0.48), hoodieMat);
        torso.position.y = 1.35;
        torso.castShadow = true;
        this.playerBodyMesh.add(torso);

        // Head
        this.headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.58, 0.58), skinMat);
        this.headMesh.position.y = 2.18;
        this.headMesh.castShadow = true;
        this.playerBodyMesh.add(this.headMesh);

        // Cap
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.26, 0.62), capMat);
        cap.position.set(0, 0.2, -0.04);
        this.headMesh.add(cap);

        // Limbs
        const armGeo = new THREE.BoxGeometry(0.24, 0.78, 0.24);
        this.leftArm = new THREE.Mesh(armGeo, hoodieMat);
        this.leftArm.position.set(-0.55, 1.45, 0);
        this.playerBodyMesh.add(this.leftArm);

        this.rightArm = new THREE.Mesh(armGeo, hoodieMat);
        this.rightArm.position.set(0.55, 1.45, 0);
        this.playerBodyMesh.add(this.rightArm);

        const legGeo = new THREE.BoxGeometry(0.28, 0.88, 0.28);
        this.leftLeg = new THREE.Mesh(legGeo, pantsMat);
        this.leftLeg.position.set(-0.25, 0.6, 0);
        this.playerBodyMesh.add(this.leftLeg);

        this.rightLeg = new THREE.Mesh(legGeo, pantsMat);
        this.rightLeg.position.set(0.25, 0.6, 0);
        this.playerBodyMesh.add(this.rightLeg);

        // Hoverboard
        this.hoverboardMesh = new THREE.Group();
        const deck = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.1, 2.1), new THREE.MeshStandardMaterial({ color: this.currentHoverboardSkin.deckColor }));
        deck.position.y = 0.14;
        this.hoverboardMesh.add(deck);
        this.hoverboardMesh.visible = false;
        this.playerGroup.add(this.hoverboardMesh);

        // Jetpack
        this.jetpackMesh = new THREE.Group();
        const t1 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.72, 10), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        t1.position.set(-0.22, 1.45, -0.34);
        const t2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.72, 10), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        t2.position.set(0.22, 1.45, -0.34);
        this.jetpackMesh.add(t1);
        this.jetpackMesh.add(t2);
        this.jetpackMesh.visible = false;
        this.playerBodyMesh.add(this.jetpackMesh);

        // Blob Shadow
        this.shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(0.7, 16), new THREE.MeshBasicMaterial({ color: 0x020617, transparent: true, opacity: 0.5 }));
        this.shadowMesh.rotation.x = -Math.PI / 2;
        this.shadowMesh.position.y = 0.05;
        this.scene.add(this.shadowMesh);

        this.playerGroup.add(this.playerBodyMesh);
        this.scene.add(this.playerGroup);
      }

      initWeatherSystem() {
        this.weatherGroup = new THREE.Group();
        this.scene.add(this.weatherGroup);
        this.rebuildWeatherParticles();
      }

      rebuildWeatherParticles() {
        while (this.weatherGroup.children.length > 0) {
          this.weatherGroup.remove(this.weatherGroup.children[0]);
        }
        this.weatherParticles = [];
        const cfg = SEASONS_DATA[this.currentSeason];
        const count = 70;
        const geo = cfg.particleType === 'PETALS' || cfg.particleType === 'LEAVES'
          ? new THREE.PlaneGeometry(0.3, 0.35)
          : new THREE.SphereGeometry(0.12, 6, 6);
        const mat = new THREE.MeshBasicMaterial({ color: cfg.particleColor, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });

        for (let i = 0; i < count; i++) {
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set((Math.random() - 0.5) * 26, Math.random() * 12 + 1, -Math.random() * 45 + 5);
          this.weatherGroup.add(mesh);
          this.weatherParticles.push({
            mesh,
            velocity: new THREE.Vector3((Math.random() - 0.5) * 1.5, -(Math.random() * 2.2 + 1.2), Math.random() * 1.5 + 0.5),
            rotSpeed: new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, 0)
          });
        }
      }

      transitionToSeason(season) {
        this.currentSeason = season;
        const cfg = SEASONS_DATA[season];
        if (this.skyTextures[season]) {
          this.skyDomeMesh.material.map = this.skyTextures[season];
          this.skyDomeMesh.material.needsUpdate = true;
        }
        this.scene.fog.color.setHex(cfg.fogColor);
        this.scene.background.setHex(cfg.fogColor);
        this.ambientLight.color.setHex(cfg.ambientColor);
        this.sunLight.color.setHex(cfg.sunColor);
        this.rebuildWeatherParticles();
        soundManager.playSeasonChange();
        this.callbacks.onSeasonChange(season, cfg.name, cfg.icon, cfg.subtitle);
      }

      initWorld() {
        for (let i = 0; i < this.totalChunks; i++) {
          const chunk = this.createForestChunk(-i * this.chunkLength, i === 0, this.currentSeason);
          this.trackChunks.push(chunk);
          this.scene.add(chunk);
        }
      }

      createForestChunk(zPos, isStart, season) {
        const chunk = new THREE.Group();
        chunk.position.z = zPos;
        const cfg = SEASONS_DATA[season];

        // Ground
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(36, this.chunkLength),
          new THREE.MeshStandardMaterial({ map: this.groundTextures[season], roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, 0, -this.chunkLength / 2);
        ground.receiveShadow = true;
        chunk.add(ground);

        // Rails
        const railMat = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, metalness: 0.95, roughness: 0.2 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: cfg.sleeperColor, roughness: 0.9 });
        [-this.laneWidth, 0, this.laneWidth].forEach(lx => {
          [-0.7, 0.7].forEach(rox => {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, this.chunkLength), railMat);
            rail.position.set(lx + rox, 0.08, -this.chunkLength / 2);
            chunk.add(rail);
          });
          for (let s = 0; s < 18; s++) {
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.38), sleeperMat);
            sleeper.position.set(lx, 0.04, -s * (this.chunkLength / 18));
            chunk.add(sleeper);
          }
        });

        // Trees
        for (let r = 0; r < 5; r++) {
          const zOffset = -r * 13 - Math.random() * 3;
          [-10.5, 10.5].forEach(sideX => {
            const tree = this.createForestTree(season);
            tree.position.set(sideX, 0, zOffset);
            chunk.add(tree);
          });
        }

        if (!isStart) {
          this.populateChunkContent(chunk, zPos, season);
        }
        return chunk;
      }

      createForestTree(season) {
        const tree = new THREE.Group();
        const cfg = SEASONS_DATA[season];
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3.5, 6), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
        trunk.position.y = 1.75;
        tree.add(trunk);

        const col = cfg.treeColors[Math.floor(Math.random() * cfg.treeColors.length)];
        const folMat = new THREE.MeshStandardMaterial({ color: col });
        for (let t = 0; t < 3; t++) {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(2.0 - t * 0.4, 1.8, 6), folMat);
          cone.position.y = 3.2 + t * 1.2;
          tree.add(cone);
        }
        return tree;
      }

      populateChunkContent(chunk, chunkZ, season) {
        const lanes = [-1, 0, 1];
        if (Math.random() < 0.5) {
          const trainLane = lanes[Math.floor(Math.random() * 3)];
          const train = this.createForestTrain(trainLane, season);
          train.position.set(trainLane * this.laneWidth, 0, -25);
          chunk.add(train);
          this.obstacles.push({ mesh: train, lane: trainLane, type: 'TRAIN', length: 22, height: 3.2, isTrain: true, active: true });

          // Coins on top
          for (let c = 0; c < 5; c++) {
            const coin = this.createCoinMesh();
            coin.position.set(trainLane * this.laneWidth, 3.8, -32 + c * 3);
            chunk.add(coin);
            this.coins.push({ mesh: coin, lane: trainLane, y: 3.8, active: true, isMagnetized: false });
          }
        } else {
          const lane = lanes[Math.floor(Math.random() * 3)];
          const isLow = Math.random() > 0.4;
          const barrier = isLow ? this.createLowBarrier(season) : this.createHighBarrier(season);
          barrier.position.set(lane * this.laneWidth, 0, -28);
          chunk.add(barrier);
          this.obstacles.push({ mesh: barrier, lane, type: isLow ? 'BARRIER_LOW' : 'BARRIER_HIGH', length: 1.2, height: isLow ? 1.1 : 2.5, isTrain: false, active: true });

          // Free lane coins
          const freeLane = lanes.find(l => l !== lane);
          for (let c = 0; c < 7; c++) {
            const coin = this.createCoinMesh();
            coin.position.set(freeLane * this.laneWidth, 1.0, -15 - c * 4);
            chunk.add(coin);
            this.coins.push({ mesh: coin, lane: freeLane, y: 1.0, active: true, isMagnetized: false });
          }
        }

        // Powerup
        if (Math.random() < 0.35) {
          const pLane = lanes[Math.floor(Math.random() * 3)];
          const types = ['MAGNET', 'MULTIPLIER', 'JETPACK', 'SNEAKERS'];
          const type = types[Math.floor(Math.random() * types.length)];
          const pMesh = this.createPowerUpMesh(type);
          pMesh.position.set(pLane * this.laneWidth, 1.3, -35);
          chunk.add(pMesh);
          this.powerUpItems.push({ mesh: pMesh, type, lane: pLane, y: 1.3, active: true });
        }
      }

      createForestTrain(lane, season) {
        const train = new THREE.Group();
        const colors = ['#047857', '#b45309', '#1d4ed8', '#be123c'];
        const col = colors[Math.abs(lane + 1) % colors.length];
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.2, 22), new THREE.MeshStandardMaterial({ map: createCorrugatedMetalTexture(col) }));
        body.position.y = 1.75;
        body.castShadow = true;
        train.add(body);

        const ramp = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 2.5), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        ramp.rotation.x = -0.55;
        ramp.position.set(0, 1.25, 11.5);
        train.add(ramp);
        return train;
      }

      createLowBarrier(season) {
        const g = new THREE.Group();
        const log = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 2.8, 8), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
        log.rotation.z = Math.PI / 2;
        log.position.set(0, 0.88, 0);
        g.add(log);
        return g;
      }

      createHighBarrier(season) {
        const g = new THREE.Group();
        const beam = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.4, 0.38), new THREE.MeshStandardMaterial({ map: this.hazardTexture }));
        beam.position.set(0, 2.1, 0);
        g.add(beam);
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 6), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
        p1.position.set(-1.4, 1.6, 0);
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 6), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
        p2.position.set(1.4, 1.6, 0);
        g.add(p1);
        g.add(p2);
        return g;
      }

      createCoinMesh() {
        const g = new THREE.Group();
        const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.15 }));
        coin.rotation.x = Math.PI / 2;
        g.add(coin);
        return g;
      }

      createPowerUpMesh(type) {
        const g = new THREE.Group();
        const orb = new THREE.Mesh(new THREE.SphereGeometry(0.85, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
        g.add(orb);
        let color = 0xef4444;
        if (type === 'MULTIPLIER') color = 0x3b82f6;
        if (type === 'JETPACK') color = 0x10b981;
        if (type === 'SNEAKERS') color = 0xeab308;
        const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 }));
        g.add(core);
        return g;
      }

      moveLeft() {
        if (!this.isRunning || this.isPaused) return;
        if (this.currentLane > -1) {
          this.currentLane -= 1;
          this.targetLaneX = this.currentLane * this.laneWidth;
          soundManager.playSlide();
        }
      }

      moveRight() {
        if (!this.isRunning || this.isPaused) return;
        if (this.currentLane < 1) {
          this.currentLane += 1;
          this.targetLaneX = this.currentLane * this.laneWidth;
          soundManager.playSlide();
        }
      }

      jump() {
        if (!this.isRunning || this.isPaused) return;
        if (this.activePowerUps.has('JETPACK')) return;
        if (this.isGrounded || this.playerY <= this.currentGroundY + 0.25) {
          this.playerVelocityY = this.activePowerUps.has('SNEAKERS') ? 23 : 17.5;
          this.isGrounded = false;
          this.isJumping = true;
          this.isSliding = false;
          soundManager.playJump();
        }
      }

      slide() {
        if (!this.isRunning || this.isPaused) return;
        if (this.activePowerUps.has('JETPACK')) return;
        this.isSliding = true;
        this.slideTimer = 0.85;
        if (!this.isGrounded) this.playerVelocityY = -28;
        soundManager.playSlide();
      }

      activateHoverboard() {
        if (!this.isRunning || this.isPaused || this.hasHoverboard) return;
        this.hasHoverboard = true;
        this.hoverboardTime = 25;
        this.hoverboardMesh.visible = true;
        soundManager.playHoverboard();
        this.callbacks.onHoverboardActivated();
      }

      start() {
        this.isRunning = true;
        this.isPaused = false;
        this.currentSpeed = this.baseSpeed;
        this.distanceTraveled = 0;
        this.score = 0;
        this.coinsThisRun = 0;
        this.scoreMultiplier = 1;
        this.currentLane = 0;
        this.targetLaneX = 0;
        this.playerX = 0;
        this.playerY = 0;
        this.playerVelocityY = 0;
        this.isGrounded = true;
        this.hasHoverboard = false;
        this.activePowerUps.clear();
        this.hoverboardMesh.visible = false;
        this.jetpackMesh.visible = false;

        this.currentSeasonIndex = 0;
        this.currentSeason = 'SPRING';
        this.seasonTimer = 0;
        this.transitionToSeason('SPRING');

        this.resetWorld();
        this.clock.start();
        soundManager.startMusic();
        this.animate();
      }

      pause() { this.isPaused = true; }
      resume() { this.isPaused = false; }

      resetWorld() {
        this.obstacles.forEach(o => { if (o.mesh.parent) o.mesh.parent.remove(o.mesh); });
        this.coins.forEach(c => { if (c.mesh.parent) c.mesh.parent.remove(c.mesh); });
        this.powerUpItems.forEach(p => { if (p.mesh.parent) p.mesh.parent.remove(p.mesh); });
        this.obstacles = [];
        this.coins = [];
        this.powerUpItems = [];

        for (let i = 0; i < this.trackChunks.length; i++) {
          const chunk = this.trackChunks[i];
          chunk.position.z = -i * this.chunkLength;
          if (i > 0) this.populateChunkContent(chunk, chunk.position.z, this.currentSeason);
        }
      }

      animate = () => {
        if (!this.isRunning) return;
        this.animationFrameId = requestAnimationFrame(this.animate);
        const delta = Math.min(this.clock.getDelta(), 0.05);
        if (this.isPaused) return;

        this.updateGame(delta);
        this.renderer.render(this.scene, this.camera);
      };

      updateGame(delta) {
        if (this.currentSpeed < this.maxSpeed) this.currentSpeed += delta * 0.45;
        const moveStep = this.currentSpeed * delta;
        this.distanceTraveled += moveStep;

        // Season Progression
        this.seasonTimer += delta;
        const progress = Math.min(1, this.seasonTimer / this.seasonDuration);
        const secondsLeft = Math.max(0, Math.ceil(this.seasonDuration - this.seasonTimer));
        this.callbacks.onSeasonProgress(progress, secondsLeft, this.currentSeason);

        if (this.seasonTimer >= this.seasonDuration) {
          this.seasonTimer = 0;
          this.currentSeasonIndex = (this.currentSeasonIndex + 1) % SEASONS_ORDER.length;
          this.transitionToSeason(SEASONS_ORDER[this.currentSeasonIndex]);
        }

        // Score
        const mult = this.scoreMultiplier * (this.activePowerUps.has('MULTIPLIER') ? 2 : 1);
        this.score += moveStep * mult * 0.8;
        this.callbacks.onScoreUpdate(Math.floor(this.score), Math.floor(this.distanceTraveled), mult);

        // Power-ups countdown
        this.activePowerUps.forEach((d, type) => {
          d.remaining -= delta;
          if (d.remaining <= 0) {
            this.activePowerUps.delete(type);
            this.callbacks.onPowerUpEnd(type);
            if (type === 'JETPACK') this.jetpackMesh.visible = false;
          }
        });

        if (this.hasHoverboard) {
          this.hoverboardTime -= delta;
          if (this.hoverboardTime <= 0) {
            this.hasHoverboard = false;
            this.hoverboardMesh.visible = false;
            this.callbacks.onHoverboardDestroyed();
          }
        }

        // Player lateral move
        const dx = this.targetLaneX - this.playerX;
        this.playerX += dx * 14 * delta;
        this.playerGroup.rotation.z = -dx * 0.12;

        // Vertical physics
        if (this.activePowerUps.has('JETPACK')) {
          this.playerY += (8.5 - this.playerY) * 6 * delta;
          this.jetpackMesh.visible = true;
          this.isGrounded = false;
        } else {
          let detectedGroundY = 0;
          this.obstacles.forEach(obs => {
            if (obs.active && obs.isTrain && Math.abs(obs.lane - this.currentLane) < 0.6) {
              const obsZ = obs.mesh.parent ? obs.mesh.parent.position.z + obs.mesh.position.z : obs.mesh.position.z;
              if (obsZ - 11 <= 1.0 && obsZ + 11 >= -1.0) detectedGroundY = obs.height + 0.15;
            }
          });
          this.currentGroundY = detectedGroundY;

          if (!this.isGrounded || this.playerY > this.currentGroundY) {
            this.playerVelocityY -= 48 * delta;
            this.playerY += this.playerVelocityY * delta;
            if (this.playerY <= this.currentGroundY) {
              this.playerY = this.currentGroundY;
              this.playerVelocityY = 0;
              this.isGrounded = true;
              this.isJumping = false;
            }
          }
        }

        // Slide crouch
        if (this.isSliding) {
          this.slideTimer -= delta;
          if (this.slideTimer <= 0) this.isSliding = false;
          this.playerBodyMesh.scale.set(1.1, 0.45, 1.3);
          this.playerBodyMesh.position.y = -0.4;
        } else {
          this.playerBodyMesh.scale.set(1, 1, 1);
          this.playerBodyMesh.position.y = 0;
        }

        this.playerGroup.position.set(this.playerX, this.playerY, 0);
        this.shadowMesh.position.set(this.playerX, this.currentGroundY + 0.05, 0);

        // Limbs animation
        const runCycle = this.clock.getElapsedTime() * (this.currentSpeed * 0.7);
        if (!this.isSliding && this.isGrounded && !this.hasHoverboard && !this.activePowerUps.has('JETPACK')) {
          this.leftLeg.rotation.x = Math.sin(runCycle) * 0.85;
          this.rightLeg.rotation.x = -Math.sin(runCycle) * 0.85;
          this.leftArm.rotation.x = -Math.sin(runCycle) * 0.75;
          this.rightArm.rotation.x = Math.sin(runCycle) * 0.75;
        }

        // Move Chunks
        this.trackChunks.forEach(chunk => {
          chunk.position.z += moveStep;
          if (chunk.position.z > this.chunkLength) {
            let minZ = 0;
            this.trackChunks.forEach(c => { if (c.position.z < minZ) minZ = c.position.z; });
            chunk.position.z = minZ - this.chunkLength;

            this.obstacles = this.obstacles.filter(o => o.mesh.parent !== chunk);
            this.coins = this.coins.filter(c => c.mesh.parent !== chunk);
            this.powerUpItems = this.powerUpItems.filter(p => p.mesh.parent !== chunk);
            this.populateChunkContent(chunk, chunk.position.z, this.currentSeason);
          }
        });

        // Weather particles
        for (let w = 0; w < this.weatherParticles.length; w++) {
          const wp = this.weatherParticles[w];
          wp.mesh.position.addScaledVector(wp.velocity, delta * 2.5);
          if (wp.mesh.position.y < 0.2 || wp.mesh.position.z > 10) {
            wp.mesh.position.set((Math.random() - 0.5) * 26, Math.random() * 8 + 8, -Math.random() * 40 - 10);
          }
        }

        // Coins magnet & pickup
        const hasMagnet = this.activePowerUps.has('MAGNET');
        this.coins.forEach(coin => {
          if (!coin.active || !coin.mesh.parent) return;
          coin.mesh.rotation.y += delta * 5;
          const coinZ = coin.mesh.parent.position.z + coin.mesh.position.z;
          const coinX = coin.mesh.position.x;
          const coinY = coin.mesh.position.y;

          if (hasMagnet && Math.abs(coinZ) < 14) {
            coin.mesh.position.x += (this.playerX - coinX) * 12 * delta;
            coin.mesh.position.y += (this.playerY + 1.2 - coinY) * 12 * delta;
          }

          if (Math.abs(coinZ) < 1.4 && Math.abs(coinX - this.playerX) < 1.3 && Math.abs(coinY - (this.playerY + 1.0)) < 1.8) {
            coin.active = false;
            coin.mesh.visible = false;
            this.coinsThisRun++;
            const now = performance.now();
            if (now - this.lastCoinTime < 800) this.coinCombo++; else this.coinCombo = 1;
            this.lastCoinTime = now;
            soundManager.playCoin(this.coinCombo);
            let comboText = '';
            if (this.coinCombo >= 15) comboText = 'FEVER x4!';
            else if (this.coinCombo >= 10) comboText = 'MEGA COMBO!';
            else if (this.coinCombo >= 5) comboText = 'COMBO x2!';
            this.callbacks.onCoinCollected(this.coinsThisRun, this.coinCombo, comboText);
          }
        });

        // Power-ups pickup
        this.powerUpItems.forEach(item => {
          if (!item.active || !item.mesh.parent) return;
          item.mesh.rotation.y += delta * 3;
          const itemZ = item.mesh.parent.position.z + item.mesh.position.z;
          if (Math.abs(itemZ) < 1.5 && Math.abs(item.mesh.position.x - this.playerX) < 1.4 && Math.abs(item.mesh.position.y - (this.playerY + 1.2)) < 1.8) {
            item.active = false;
            item.mesh.visible = false;
            soundManager.playPowerUp();
            const dur = this.powerUpDurations[item.type];
            this.activePowerUps.set(item.type, { remaining: dur, max: dur });
            this.callbacks.onPowerUpCollected(item.type, dur);
          }
        });

        // Obstacles collision
        if (!this.activePowerUps.has('JETPACK')) {
          for (let i = 0; i < this.obstacles.length; i++) {
            const obs = this.obstacles[i];
            if (!obs.active || !obs.mesh.parent) continue;
            const obsZ = obs.mesh.parent.position.z + obs.mesh.position.z;
            const halfLen = obs.length / 2;
            if (obsZ - halfLen <= 0.6 && obsZ + halfLen >= -0.6) {
              if (Math.abs(this.playerX - obs.lane * this.laneWidth) < 1.25) {
                if (obs.type === 'BARRIER_LOW' && this.playerY < 1.15) { this.handleCollision(); break; }
                if (obs.type === 'BARRIER_HIGH' && (!this.isSliding || this.playerY > 0.5)) { this.handleCollision(); break; }
                if (obs.type === 'TRAIN' && this.playerY < obs.height - 0.3) { this.handleCollision(); break; }
              }
            }
          }
        }

        // Camera follow
        this.camera.position.x += (this.playerX * 0.45 - this.camera.position.x) * 10 * delta;
        this.camera.position.y += ((this.activePowerUps.has('JETPACK') ? 11.5 : Math.max(4.0, this.playerY + 3.4)) - this.camera.position.y) * 8 * delta;
        this.camera.lookAt(this.playerX * 0.25, this.playerY + 1.6, -12);
      }

      handleCollision() {
        soundManager.playCrash();
        if (this.hasHoverboard) {
          this.hasHoverboard = false;
          this.hoverboardMesh.visible = false;
          this.callbacks.onHoverboardDestroyed();
          this.obstacles.forEach(o => { if (Math.abs(o.mesh.position.z) < 15) { o.active = false; o.mesh.visible = false; } });
          return;
        }
        this.isRunning = false;
        if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
        soundManager.stopMusic();
        this.callbacks.onGameOver(Math.floor(this.score), this.coinsThisRun, Math.floor(this.distanceTraveled));
      }

      handleResize() {
        if (!this.renderer || !this.camera || !this.container) return;
        this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
      }

      destroy() {
        this.isRunning = false;
        if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
        soundManager.stopMusic();
        window.removeEventListener('resize', this.handleResize);
        if (this.renderer && this.renderer.domElement && this.renderer.domElement.parentElement) {
          this.renderer.domElement.parentElement.removeChild(this.renderer.domElement);
        }
      }
    }

    // --- REACT APPLICATION UI ---
    function App() {
      const containerRef = useRef(null);
      const engineRef = useRef(null);

      const [gameState, setGameState] = useState('MENU');
      const [isPaused, setIsPaused] = useState(false);
      const [totalCoins, setTotalCoins] = useState(() => parseInt(localStorage.getItem('rush_coins') || '100', 10));
      const [highScore, setHighScore] = useState(() => parseInt(localStorage.getItem('rush_highscore') || '0', 10));

      const [score, setScore] = useState(0);
      const [distance, setDistance] = useState(0);
      const [coinsThisRun, setCoinsThisRun] = useState(0);
      const [multiplier, setMultiplier] = useState(1);
      const [combo, setCombo] = useState(0);
      const [comboText, setComboText] = useState('');
      const [hasHoverboard, setHasHoverboard] = useState(false);
      const [activePowerUps, setActivePowerUps] = useState([]);

      const [currentSeason, setCurrentSeason] = useState('SPRING');
      const [seasonProgress, setSeasonProgress] = useState(0);
      const [seasonSecondsLeft, setSeasonSecondsLeft] = useState(22);
      const [seasonBanner, setSeasonBanner] = useState(null);
      const [lastRun, setLastRun] = useState(null);

      useEffect(() => { localStorage.setItem('rush_coins', totalCoins.toString()); }, [totalCoins]);
      useEffect(() => { localStorage.setItem('rush_highscore', highScore.toString()); }, [highScore]);

      useEffect(() => {
        if (!containerRef.current) return;
        const skin = { hoodieColor: '#2563eb', pantsColor: '#1e293b', capColor: '#dc2626', skinTone: '#fbcfe8' };
        const board = { deckColor: '#0284c7' };
        const engine = new SubwayEngine(containerRef.current, {
          onCoinCollected: (runCoins, curCombo, text) => {
            setCoinsThisRun(runCoins);
            setTotalCoins(prev => prev + 1);
            setCombo(curCombo);
            setComboText(text);
          },
          onScoreUpdate: (s, d, m) => { setScore(s); setDistance(d); setMultiplier(m); },
          onPowerUpCollected: (type, duration) => {
            setActivePowerUps(prev => [...prev.filter(p => p.type !== type), { type, remaining: duration, max: duration }]);
          },
          onPowerUpEnd: (type) => { setActivePowerUps(prev => prev.filter(p => p.type !== type)); },
          onHoverboardActivated: () => setHasHoverboard(true),
          onHoverboardDestroyed: () => setHasHoverboard(false),
          onGameOver: (finalScore, finalCoins, finalDist) => {
            setGameState('GAMEOVER');
            setScore(finalScore);
            setCoinsThisRun(finalCoins);
            setDistance(finalDist);
            const isNew = finalScore > highScore;
            if (isNew) {
              setHighScore(finalScore);
              confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
            setLastRun({ score: finalScore, coins: finalCoins, distance: finalDist, isNew });
          },
          onSeasonChange: (season, name, icon, subtitle) => {
            setCurrentSeason(season);
            setSeasonBanner({ name, icon, subtitle });
            setTimeout(() => setSeasonBanner(null), 3500);
          },
          onSeasonProgress: (prog, sec, season) => {
            setSeasonProgress(prog);
            setSeasonSecondsLeft(sec);
            setCurrentSeason(season);
          }
        }, skin, board);

        engineRef.current = engine;
        return () => engine.destroy();
      }, []);

      // Controls (Keyboard & Touch)
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.repeat) return;
          if (e.key === 'p' || e.key === 'Escape') { togglePause(); return; }
          if (gameState !== 'PLAYING' || isPaused) return;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') engineRef.current?.moveLeft();
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') engineRef.current?.moveRight();
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') engineRef.current?.jump();
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') engineRef.current?.slide();
          if (e.key === ' ') engineRef.current?.activateHoverboard();
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [gameState, isPaused]);

      const handleStart = () => {
        setGameState('PLAYING');
        setIsPaused(false);
        setScore(0);
        setDistance(0);
        setCoinsThisRun(0);
        setCombo(0);
        setComboText('');
        setHasHoverboard(false);
        setActivePowerUps([]);
        setCurrentSeason('SPRING');
        setSeasonProgress(0);
        setSeasonSecondsLeft(22);
        setSeasonBanner({ name: 'Flores da Primavera', icon: '🌸', subtitle: 'Cerejeiras em flor e pétalas ao vento' });
        setTimeout(() => setSeasonBanner(null), 3500);
        engineRef.current?.start();
      };

      const togglePause = () => {
        if (isPaused) { engineRef.current?.resume(); setIsPaused(false); }
        else { engineRef.current?.pause(); setIsPaused(true); }
      };

      return (
        <div className="relative w-screen h-screen overflow-hidden bg-slate-950 font-sans select-none">
          <div ref={containerRef} className="absolute inset-0 w-full h-full z-0 cursor-grab" />

          {/* MENU SCREEN */}
          {gameState === 'MENU' && (
            <div className="absolute inset-0 z-20 flex flex-col justify-between p-6 pointer-events-none select-none bg-gradient-to-t from-slate-950/80 via-transparent to-slate-950/70">
              <div className="flex items-center justify-between pointer-events-auto">
                <div className="flex items-center gap-2 px-4 py-2 bg-slate-900/85 backdrop-blur-md rounded-2xl border border-amber-500/30">
                  <span className="text-xl">🪙</span>
                  <div>
                    <span className="text-[10px] uppercase text-slate-400 font-bold block">Moedas</span>
                    <span className="text-xl font-display font-bold text-amber-300">{totalCoins.toLocaleString('pt-BR')}</span>
                  </div>
                </div>
                <div className="flex items-center gap-2 px-4 py-2 bg-slate-900/85 backdrop-blur-md rounded-2xl border border-slate-700/60">
                  <div>
                    <span className="text-[10px] uppercase text-slate-400 font-bold block">Recorde</span>
                    <span className="text-xl font-display font-bold text-white">{highScore.toLocaleString('pt-BR')}</span>
                  </div>
                </div>
              </div>

              <div className="flex flex-col items-center my-auto pointer-events-auto text-center">
                <div className="mb-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 rounded-full text-emerald-400 text-xs font-semibold">
                  🌲 FLORESTA DAS 4 ESTAÇÕES EM 3D
                </div>
                <h1 className="text-5xl sm:text-7xl font-display font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-amber-400 drop-shadow-lg mb-3">
                  FOREST RUSH 3D
                </h1>
                <p className="text-sm sm:text-base text-slate-300 max-w-lg mb-4 drop-shadow">
                  Quanto mais tempo você sobreviver sem perder, as estações mudam em tempo real: Flores 🌸, Verão ☀️, Outono 🍁 e Neve ❄️!
                </p>

                <div className="flex gap-2 mb-8">
                  <span className="px-2.5 py-1 bg-pink-500/20 border border-pink-500/30 rounded-lg text-xs font-bold text-pink-300">🌸 Flores</span>
                  <span className="px-2.5 py-1 bg-amber-500/20 border border-amber-500/30 rounded-lg text-xs font-bold text-amber-300">☀️ Quente</span>
                  <span className="px-2.5 py-1 bg-orange-500/20 border border-orange-500/30 rounded-lg text-xs font-bold text-orange-300">🍁 Gelado</span>
                  <span className="px-2.5 py-1 bg-cyan-500/20 border border-cyan-500/30 rounded-lg text-xs font-bold text-cyan-300">❄️ Neve</span>
                </div>

                <button
                  onClick={handleStart}
                  className="px-10 py-5 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-display font-black text-2xl tracking-wider rounded-2xl shadow-2xl shadow-amber-500/30 active:scale-95 transition-all cursor-pointer animate-pulse"
                >
                  INICIAR CORRIDA
                </button>
              </div>

              <div className="text-center text-xs text-slate-400">
                Use Setas ou A/D para mover, W para pular, S para rolar e Espaço para o Skate!
              </div>
            </div>
          )}

          {/* PLAYING HUD */}
          {gameState === 'PLAYING' && (
            <div className="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-20">
              <div className="flex justify-between items-start">
                <div className="flex flex-col gap-1.5 pointer-events-auto">
                  <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-900/85 backdrop-blur-md rounded-xl border border-amber-500/30 shadow-lg">
                    <span className="text-lg">🪙</span>
                    <span className="text-xl font-display font-bold text-amber-300">{coinsThisRun}</span>
                  </div>
                  <button
                    onClick={() => engineRef.current?.activateHoverboard()}
                    disabled={hasHoverboard}
                    className={`px-3 py-1.5 rounded-lg border text-xs font-bold transition-all shadow-md active:scale-95 ${
                      hasHoverboard ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-400' : 'bg-cyan-950/80 border-cyan-500/40 text-cyan-300'
                    }`}
                  >
                    {hasHoverboard ? 'SKATE ATIVO' : 'SKATE (ESPAÇO)'}
                  </button>
                </div>

                {/* Season Tracker */}
                <div className="flex flex-col items-center pointer-events-auto">
                  <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-xl shadow-lg">
                    <span className="text-lg">{SEASONS_DATA[currentSeason].icon}</span>
                    <div className="flex flex-col min-w-[90px]">
                      <div className="flex justify-between text-[11px] font-bold text-slate-200">
                        <span>{SEASONS_DATA[currentSeason].name.split(' ')[0]}</span>
                        <span className="text-amber-400">{seasonSecondsLeft}s</span>
                      </div>
                      <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-0.5">
                        <div className="h-full bg-gradient-to-r from-emerald-400 to-amber-400" style={{ width: `${seasonProgress * 100}%` }} />
                      </div>
                    </div>
                  </div>
                  {combo > 2 && (
                    <div className="mt-1 px-3 py-0.5 bg-amber-500 text-slate-950 font-black text-xs rounded-lg animate-bounce">
                      {comboText || `COMBO x${combo}!`}
                    </div>
                  )}
                </div>

                <div className="flex items-start gap-2 pointer-events-auto">
                  <div className="px-3.5 py-1.5 bg-slate-900/80 backdrop-blur-md rounded-xl border border-slate-700/60 shadow-lg text-right">
                    <span className="text-xl font-display font-bold text-white block">{score.toLocaleString('pt-BR')}</span>
                    <span className="text-[10px] text-slate-400">{distance}m</span>
                  </div>
                  <button onClick={togglePause} className="p-2.5 bg-slate-900/80 hover:bg-slate-800 rounded-xl border border-slate-700 cursor-pointer">
                    {isPaused ? '▶️' : '⏸️'}
                  </button>
                </div>
              </div>

              {/* Toast Season Announcement */}
              {seasonBanner && (
                <div className="w-full flex justify-center my-auto pointer-events-none animate-bounce">
                  <div className="flex items-center gap-3 px-6 py-3.5 bg-slate-950/90 border-2 border-amber-400/80 rounded-2xl shadow-2xl backdrop-blur-md text-center max-w-md">
                    <span className="text-4xl">{seasonBanner.icon}</span>
                    <div className="flex flex-col text-left">
                      <span className="text-[10px] uppercase tracking-widest text-amber-300 font-extrabold">Nova Estação do Tempo!</span>
                      <span className="text-xl font-display font-black text-white">{seasonBanner.name}</span>
                      <span className="text-xs text-slate-300">{seasonBanner.subtitle}</span>
                    </div>
                  </div>
                </div>
              )}

              {/* Mobile Touch Controls */}
              <div className="flex justify-between items-end pointer-events-none pb-2">
                <div className="flex gap-2 pointer-events-auto">
                  <button onClick={() => engineRef.current?.moveLeft()} className="w-14 h-14 bg-slate-900/80 border border-slate-700 text-white rounded-2xl text-xl flex items-center justify-center active:scale-90">←</button>
                  <button onClick={() => engineRef.current?.moveRight()} className="w-14 h-14 bg-slate-900/80 border border-slate-700 text-white rounded-2xl text-xl flex items-center justify-center active:scale-90">→</button>
                </div>
                <div className="flex flex-col gap-2 pointer-events-auto">
                  <button onClick={() => engineRef.current?.jump()} className="w-14 h-14 bg-blue-600/90 border border-blue-400 text-white rounded-2xl text-xl flex items-center justify-center active:scale-90">↑</button>
                  <button onClick={() => engineRef.current?.slide()} className="w-14 h-14 bg-amber-600/90 border border-amber-400 text-white rounded-2xl text-xl flex items-center justify-center active:scale-90">↓</button>
                </div>
              </div>
            </div>
          )}

          {/* GAMEOVER SCREEN */}
          {gameState === 'GAMEOVER' && lastRun && (
            <div className="absolute inset-0 z-30 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center">
                {lastRun.isNew && (
                  <div className="px-4 py-1.5 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full text-xs font-bold mb-2 animate-pulse">
                    🏆 NOVO RECORDE PESSOAL!
                  </div>
                )}
                <h2 className="text-3xl font-display font-black text-white mb-6">
                  {lastRun.isNew ? 'Incrível!' : 'Fim de Corrida!'}
                </h2>
                <div className="grid grid-cols-2 gap-3 w-full mb-6">
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-3">
                    <span className="text-xs text-slate-400 block mb-1">Pontuação</span>
                    <span className="text-2xl font-display font-bold text-white">{lastRun.score.toLocaleString('pt-BR')}</span>
                  </div>
                  <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-3">
                    <span className="text-xs text-slate-400 block mb-1">🪙 Moedas Ganhas</span>
                    <span className="text-2xl font-display font-bold text-amber-400">+{lastRun.coins}</span>
                  </div>
                </div>
                <button
                  onClick={handleStart}
                  className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-display font-bold rounded-2xl shadow-lg active:scale-95 transition-all cursor-pointer text-lg"
                >
                  JOGAR NOVAMENTE
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
